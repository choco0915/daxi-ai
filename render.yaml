services:
  - type: web
    name: daxi-ai-guide
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: CHAT_RATE_LIMIT
        value: "30"
      - key: CHAT_RATE_WINDOW_SECONDS
        value: "60"
      - key: WEB_SEARCH_ENABLED
        value: "true"
