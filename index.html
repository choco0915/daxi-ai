<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大溪老街智慧導覽 - 豆干弟</title>
    <style>
        :root {
            --bg-dark: #0a0e14;
            --panel: rgba(9, 15, 25, 0.72);
            --glass: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.12);
            --text-muted: rgba(255, 255, 255, 0.62);
            --teal: #37e6c2;
            --teal-soft: rgba(55, 230, 194, 0.16);
            --blue-soft: rgba(77, 154, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", "Noto Sans TC", sans-serif;
            color: #fff;
            background: #070b12;
        }

        button,
        input {
            font: inherit;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 2px;
        }

        .light-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            filter: blur(90px);
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.55;
            animation: moveBlob 13s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: 12%;
            left: 16%;
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, #7928ca 0%, #ff0080 100%);
        }

        .blob-2 {
            right: 16%;
            bottom: 14%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #0070f3 0%, #00dfd8 100%);
            animation-delay: -4s;
        }

        .blob-3 {
            top: 38%;
            left: 46%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #ff4d4d 0%, #f9cb28 100%);
            animation-delay: -8s;
        }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            40% { transform: translate(55px, -65px) scale(1.1); }
            75% { transform: translate(-45px, 40px) scale(0.92); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .header-bar {
            position: relative;
            z-index: 2;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(7, 11, 18, 0.9);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
        }

        .brand {
            font-size: 18px;
            font-weight: 750;
            letter-spacing: 0.02em;
        }

        .kb-badge {
            font-size: 12px;
            color: var(--teal);
            padding: 6px 10px;
            border: 1px solid rgba(55, 230, 194, 0.35);
            border-radius: 999px;
            background: var(--teal-soft);
        }

        .app-layout {
            position: relative;
            z-index: 1;
            display: flex;
            height: calc(100vh - 62px);
        }

        .sidebar {
            width: 270px;
            flex: 0 0 270px;
            display: flex;
            flex-direction: column;
            padding: 18px;
            background: rgba(0, 0, 0, 0.34);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(20px);
        }

        .new-chat-btn {
            width: 100%;
            border: 1px solid rgba(55, 230, 194, 0.4);
            border-radius: 10px;
            padding: 11px 12px;
            background: var(--teal-soft);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(55, 230, 194, 0.28);
        }

        .history-title {
            margin: 18px 4px 9px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.08em;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            padding: 8px 8px 8px 10px;
            border: 1px solid transparent;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.035);
        }

        .history-item.active {
            border-color: rgba(55, 230, 194, 0.3);
            background: rgba(55, 230, 194, 0.1);
        }

        .history-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #f2f7fa;
            cursor: pointer;
            font-size: 13px;
        }

        .item-actions {
            display: flex;
            gap: 2px;
        }

        .action-btn {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #9aa6b2;
            cursor: pointer;
        }

        .action-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 48px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 12px;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .main-chat {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 26px clamp(18px, 4vw, 54px) 22px;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 2px 2px 10px;
        }

        .welcome-section {
            max-width: 760px;
            margin: 8vh auto 0;
            text-align: center;
            padding: 28px;
        }

        .welcome-section h1 {
            margin-bottom: 10px;
            font-size: clamp(26px, 4vw, 38px);
            background: linear-gradient(135deg, #51efca 0%, #65c8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-section p {
            color: var(--text-muted);
            line-height: 1.7;
        }

        .quick-buttons,
        .recommend-box {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-buttons {
            justify-content: center;
            margin-top: 22px;
        }

        .quick-btn,
        .rec-btn {
            border: 1px solid rgba(55, 230, 194, 0.34);
            border-radius: 999px;
            padding: 8px 12px;
            background: rgba(55, 230, 194, 0.1);
            color: #a8f7e5;
            cursor: pointer;
            font-size: 13px;
            transition: 0.18s ease;
        }

        .quick-btn:hover,
        .rec-btn:hover {
            transform: translateY(-1px);
            background: rgba(55, 230, 194, 0.22);
            color: #fff;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: min(760px, 78%);
            padding: 14px 17px;
            border: 1px solid var(--border);
            border-radius: 17px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.7;
        }

        .user .bubble {
            border-color: rgba(55, 230, 194, 0.3);
            background: rgba(29, 177, 150, 0.25);
        }

        .source-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 11px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .source-chip,
        .mode-chip {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 4px 8px;
            font-size: 11px;
        }

        .source-chip {
            color: #b7d7ff;
            background: var(--blue-soft);
            border: 1px solid rgba(77, 154, 255, 0.22);
        }

        .mode-chip {
            color: #a8f7e5;
            background: var(--teal-soft);
            border: 1px solid rgba(55, 230, 194, 0.22);
        }

        .recommend-area {
            min-height: 34px;
        }

        .recommend-box {
            justify-content: flex-end;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 11px 10px 17px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(9, 15, 25, 0.74);
            backdrop-filter: blur(18px);
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 7px 0;
            border: none;
            outline: none;
            background: transparent;
            color: #fff;
            font-size: 15px;
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }

        .send-btn {
            border: 1px solid rgba(55, 230, 194, 0.38);
            border-radius: 10px;
            padding: 9px 14px;
            background: rgba(55, 230, 194, 0.16);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .send-btn:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        @media (max-width: 760px) {
            .header-bar {
                padding: 0 16px;
            }

            .kb-badge {
                display: none;
            }

            .sidebar {
                display: none;
            }

            .main-chat {
                padding: 18px 12px 14px;
            }

            .bubble {
                max-width: 90%;
            }

            .recommend-box {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="light-background" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="header-bar">
        <div class="brand">光影大溪－AI 與智慧城市結合</div>
        <div class="kb-badge">data.md RAG 知識庫</div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <button class="new-chat-btn" id="new-chat-btn" type="button">＋ 新增對話</button>
            <div class="history-title">對話紀錄</div>
            <div class="history-list" id="history-list"></div>
            <div class="status-container" aria-live="polite">
                <div class="spinner" id="spinner"></div>
                <span id="status-text">豆干弟隨時待命</span>
            </div>
        </aside>

        <main class="main-chat">
            <div class="chat-messages" id="chat-messages"></div>
            <div id="welcome-container"></div>
            <div class="recommend-area" id="rec-container"></div>
            <div class="input-area">
                <input
                    id="user-input"
                    type="text"
                    maxlength="500"
                    autocomplete="off"
                    placeholder="問我大溪景點、美食、六二四、交通或旅遊路線…"
                    aria-label="輸入大溪導覽問題"
                >
                <button class="send-btn" id="send-btn" type="button">發送</button>
            </div>
        </main>
    </div>

    <script>
        "use strict";

        const STORAGE_KEY = "daxi-ai-chats-v2";
        const QUICK_QUESTIONS = [
            "大溪老街有什麼歷史特色？",
            "大溪有哪些必吃美食？",
            "六二四是什麼活動？",
            "第一次來大溪怎麼安排半日遊？",
            "大溪老街的巴洛克建築有什麼特色？",
            "開車去大溪老街可以停哪裡？"
        ];

        const historyList = document.getElementById("history-list");
        const chatMessages = document.getElementById("chat-messages");
        const welcomeContainer = document.getElementById("welcome-container");
        const recContainer = document.getElementById("rec-container");
        const userInput = document.getElementById("user-input");
        const sendButton = document.getElementById("send-btn");
        const spinner = document.getElementById("spinner");
        const statusText = document.getElementById("status-text");

        let chats = loadChats();
        let currentChatId = null;
        let isSending = false;

        function loadChats() {
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
                return parsed && typeof parsed === "object" ? parsed : {};
            } catch {
                return {};
            }
        }

        function saveChats() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
        }

        function makeChatId() {
            if (window.crypto && crypto.randomUUID) {
                return `chat_${crypto.randomUUID()}`;
            }
            return `chat_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        }

        function setBusy(busy, message = "豆干弟隨時待命") {
            isSending = busy;
            spinner.style.display = busy ? "block" : "none";
            sendButton.disabled = busy;
            userInput.disabled = busy;
            statusText.textContent = message;
        }

        function startNewChat() {
            const id = makeChatId();
            currentChatId = id;
            chats[id] = {
                title: "新對話",
                createdAt: Date.now(),
                messages: []
            };
            saveChats();
            renderChatArea();
            updateSidebar();
            showWelcome();
            fetchInitTopics();
            userInput.focus();
        }

        function showWelcome() {
            welcomeContainer.replaceChildren();

            const section = document.createElement("section");
            section.className = "welcome-section";

            const title = document.createElement("h1");
            title.textContent = "🏮 大溪小導遊・豆干弟";

            const description = document.createElement("p");
            description.textContent = "我會先從 data.md 找資料，再把找到的內容整理成自然好懂的導覽回答；資料庫沒有寫的內容，我不會自己亂補。";

            const hint = document.createElement("p");
            hint.textContent = "可以直接問問題，也可以從下面挑一個開始。";

            const buttons = document.createElement("div");
            buttons.className = "quick-buttons";

            QUICK_QUESTIONS.forEach((question) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "quick-btn";
                button.textContent = question;
                button.addEventListener("click", () => askQuestion(question));
                buttons.appendChild(button);
            });

            section.append(title, description, hint, buttons);
            welcomeContainer.appendChild(section);
        }

        function clearWelcome() {
            welcomeContainer.replaceChildren();
        }

        function createBubble(sender, text, sources = [], mode = "") {
            const message = document.createElement("div");
            message.className = `message ${sender}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";

            const content = document.createElement("div");
            content.className = "message-text";
            content.textContent = text;
            bubble.appendChild(content);

            if (sender === "bot" && (sources.length || mode)) {
                const sourceRow = document.createElement("div");
                sourceRow.className = "source-row";

                sources.forEach((source) => {
                    const chip = document.createElement("span");
                    chip.className = "source-chip";
                    chip.textContent = `data.md｜${source}`;
                    sourceRow.appendChild(chip);
                });

                if (mode) {
                    const modeChip = document.createElement("span");
                    modeChip.className = "mode-chip";
                    modeChip.textContent = mode === "openai-rag" ? "AI RAG" : "本地 RAG";
                    sourceRow.appendChild(modeChip);
                }

                bubble.appendChild(sourceRow);
            }

            message.appendChild(bubble);
            return { message, content };
        }

        function appendMessage(sender, text, options = {}) {
            const { sources = [], mode = "", save = true } = options;
            const { message } = createBubble(sender, text, sources, mode);
            chatMessages.appendChild(message);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (save && currentChatId) {
                chats[currentChatId].messages.push({ sender, text, sources, mode });
                saveChats();
            }
        }

        async function appendBotMessage(text, sources = [], mode = "", save = true) {
            const { message, content } = createBubble("bot", "", sources, mode);
            chatMessages.appendChild(message);

            // 使用 textContent 而不是 innerHTML，避免 AI / 使用者內容被當成 HTML 執行。
            const shouldAnimate = text.length <= 1000;
            if (!shouldAnimate) {
                content.textContent = text;
            } else {
                for (let i = 0; i < text.length; i += 1) {
                    content.textContent += text[i];
                    if (i % 4 === 0) {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        await new Promise((resolve) => setTimeout(resolve, 6));
                    }
                }
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (save && currentChatId) {
                chats[currentChatId].messages.push({ sender: "bot", text, sources, mode });
                saveChats();
            }
        }

        function renderChatArea() {
            chatMessages.replaceChildren();
            recContainer.replaceChildren();

            if (!currentChatId || !chats[currentChatId]) {
                return;
            }

            chats[currentChatId].messages.forEach((item) => {
                appendMessage(item.sender, item.text, {
                    sources: Array.isArray(item.sources) ? item.sources : [],
                    mode: item.mode || "",
                    save: false
                });
            });
        }

        function updateSidebar() {
            historyList.replaceChildren();

            const entries = Object.entries(chats).sort(
                (a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0)
            );

            entries.forEach(([id, chat]) => {
                const item = document.createElement("div");
                item.className = `history-item${id === currentChatId ? " active" : ""}`;

                const name = document.createElement("span");
                name.className = "history-name";
                name.textContent = chat.title || "新對話";
                name.title = chat.title || "新對話";
                name.addEventListener("click", () => loadChat(id));

                const actions = document.createElement("div");
                actions.className = "item-actions";

                const renameButton = document.createElement("button");
                renameButton.type = "button";
                renameButton.className = "action-btn";
                renameButton.textContent = "✎";
                renameButton.title = "重新命名";
                renameButton.addEventListener("click", () => renameChat(id));

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "action-btn";
                deleteButton.textContent = "✕";
                deleteButton.title = "刪除對話";
                deleteButton.addEventListener("click", () => deleteChat(id));

                actions.append(renameButton, deleteButton);
                item.append(name, actions);
                historyList.appendChild(item);
            });
        }

        function renameChat(id) {
            const oldTitle = chats[id]?.title || "新對話";
            const newTitle = window.prompt("新名稱：", oldTitle);
            if (newTitle && newTitle.trim()) {
                chats[id].title = newTitle.trim().slice(0, 40);
                saveChats();
                updateSidebar();
            }
        }

        function deleteChat(id) {
            if (!window.confirm("確定刪除這個對話嗎？")) {
                return;
            }

            delete chats[id];
            saveChats();

            if (currentChatId === id) {
                const remaining = Object.keys(chats);
                if (remaining.length) {
                    loadChat(remaining[0]);
                } else {
                    startNewChat();
                }
            } else {
                updateSidebar();
            }
        }

        function loadChat(id) {
            if (!chats[id]) {
                return;
            }
            currentChatId = id;
            clearWelcome();
            renderChatArea();
            updateSidebar();
            fetchInitTopics();
            userInput.focus();
        }

        function renderRecButtons(topics) {
            recContainer.replaceChildren();
            if (!Array.isArray(topics) || !topics.length) {
                return;
            }

            const box = document.createElement("div");
            box.className = "recommend-box";

            topics.slice(0, 8).forEach((topic) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "rec-btn";
                button.textContent = topic;
                button.addEventListener("click", () => askQuestion(topic));
                box.appendChild(button);
            });

            recContainer.appendChild(box);
        }

        async function fetchInitTopics() {
            try {
                const response = await fetch("/init_topics");
                if (!response.ok) return;
                const data = await response.json();
                renderRecButtons(data.topics || []);
            } catch {
                // 初始推薦抓不到不影響聊天主功能。
            }
        }

        function updateTitleFromQuestion(question) {
            if (!currentChatId || !chats[currentChatId]) return;
            if (chats[currentChatId].title !== "新對話") return;

            const compact = question.replace(/\s+/g, " ").trim();
            chats[currentChatId].title = compact.length > 18 ? `${compact.slice(0, 18)}…` : compact;
            saveChats();
            updateSidebar();
        }

        async function askQuestion(question) {
            if (isSending) return;
            const cleanQuestion = String(question || "").trim();
            if (!cleanQuestion) return;

            if (!currentChatId || !chats[currentChatId]) {
                startNewChat();
            }

            clearWelcome();
            recContainer.replaceChildren();
            appendMessage("user", cleanQuestion);
            updateTitleFromQuestion(cleanQuestion);
            userInput.value = "";
            setBusy(true, "豆干弟正在 data.md 裡找資料…");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: cleanQuestion })
                });

                let data;
                try {
                    data = await response.json();
                } catch {
                    throw new Error("伺服器回傳格式錯誤");
                }

                if (!response.ok) {
                    const detail = typeof data.detail === "string" ? data.detail : "請求失敗";
                    throw new Error(detail);
                }

                setBusy(false, data.mode === "openai-rag" ? "AI RAG 回答完成" : "本地 RAG 回答完成");
                await appendBotMessage(
                    data.answer || "目前沒有取得回答。",
                    Array.isArray(data.sources) ? data.sources : [],
                    data.mode || ""
                );
                renderRecButtons(data.recommendations || []);

                window.setTimeout(() => {
                    if (!isSending) statusText.textContent = "豆干弟隨時待命";
                }, 1800);
            } catch (error) {
                setBusy(false, "連線失敗");
                await appendBotMessage(
                    `抱歉，目前無法取得導覽回答。${error?.message ? `\n錯誤：${error.message}` : ""}`,
                    [],
                    "local-rag"
                );
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        async function sendMessage() {
            await askQuestion(userInput.value);
        }

        document.getElementById("new-chat-btn").addEventListener("click", startNewChat);
        sendButton.addEventListener("click", sendMessage);
        userInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.isComposing) {
                event.preventDefault();
                sendMessage();
            }
        });

        // 啟動時優先開啟最近的對話；沒有紀錄才建立新對話。
        const existingIds = Object.keys(chats);
        if (existingIds.length) {
            existingIds.sort((a, b) => (chats[b].createdAt || 0) - (chats[a].createdAt || 0));
            currentChatId = existingIds[0];
            renderChatArea();
            updateSidebar();
            if (!chats[currentChatId].messages.length) showWelcome();
            fetchInitTopics();
        } else {
            startNewChat();
        }
    </script>
</body>
</html>
